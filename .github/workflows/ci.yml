name: Java 17 Gradle build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (${{ matrix.os }}, Java 17)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat --no-daemon --console=plain clean build
      - name: Build and test (Linux)
        if: runner.os != 'Windows'
        run: sh ./gradlew --no-daemon --console=plain clean build
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ runner.os }}-jdk17
          path: |
            build/reports/
            build/test-results/test/
          if-no-files-found: ignore
          retention-days: 7
      - name: Prepare QA package (Linux)
        id: qa
        if: success() && runner.os == 'Linux'
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          shopt -s nullglob
          zips=(build/distributions/*.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "Expected one distribution ZIP, found ${#zips[@]}"
            exit 1
          fi
          if [ -n "$PR_NUMBER" ]; then
            label="pr${PR_NUMBER}"
          else
            label="${GITHUB_REF_NAME//\//-}"
          fi
          name="space-invaders-${label}-${HEAD_SHA::7}.zip"
          mkdir -p build/qa
          cp "${zips[0]}" "build/qa/${name}"
          echo "path=build/qa/${name}" >> "$GITHUB_OUTPUT"
      - name: Upload QA package (Linux)
        if: success() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.qa.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 7

  deploy-web:
    name: Deploy web build (GitHub Pages)
    # Runs only after every build/test job passes on a main push.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: web

      - name: Resolve QA package name
        id: qa
        # Must match the name built in "Prepare QA package (Linux)".
        run: echo "name=space-invaders-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.zip" >> "$GITHUB_OUTPUT"

      - name: Download QA package
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.qa.outputs.name }}
          path: dl

      - name: Assemble site
        shell: bash
        env:
          QA_NAME: ${{ steps.qa.outputs.name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p unpacked site
          zip=$(find dl -name "$QA_NAME" -type f | head -n1)
          if [ -n "$zip" ]; then
            unzip -q "$zip" -d unpacked
          else
            # Fall back to already-extracted contents.
            cp -r dl/. unpacked/
          fi
          # distZip layout: <name>/lib/<project>.jar (resources are inside the JAR).
          jar=$(find unpacked -path '*/lib/*.jar' -size +1M | head -n1)
          if [ -z "$jar" ]; then echo "Game JAR not found"; find unpacked; exit 1; fi
          cp "$jar" site/game.jar
          sed -e "s|__SHA__|${GITHUB_SHA::7}|g" \
              -e "s|__FULL_SHA__|${GITHUB_SHA}|g" \
              -e "s|__REPO_URL__|${REPO_URL}|g" \
              web/play.html > site/index.html
          ls -lh site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
